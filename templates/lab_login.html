{% extends "base.html" %}
{% block title %}Lab Login — SystemAnalyzer{% endblock %}

{% block content %}
<div style="max-width:400px; margin:80px auto;">
  <div class="card">
    <div class="card-title">&#128274; Lab Access</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div style="padding:10px 14px; border-radius:6px; margin-bottom:14px; font-size:13px;
                    background:{% if cat=='error' %}rgba(248,81,73,.15){% else %}rgba(63,185,80,.15){% endif %};
                    color:{% if cat=='error' %}var(--red){% else %}var(--green){% endif %}; border:1px solid currentColor;">
          {{ msg }}
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" style="display:flex; flex-direction:column; gap:14px;">
      <div>
        <label style="font-size:12px; color:var(--muted); display:block; margin-bottom:5px;">Username</label>
        <input name="username" type="text" autocomplete="username" required
               style="width:100%; padding:9px 12px; background:var(--bg); border:1px solid var(--border);
                      border-radius:6px; color:var(--text); font-size:13px;">
      </div>
      <div>
        <label style="font-size:12px; color:var(--muted); display:block; margin-bottom:5px;">Password</label>
        <input name="password" type="password" autocomplete="current-password" required
               style="width:100%; padding:9px 12px; background:var(--bg); border:1px solid var(--border);
                      border-radius:6px; color:var(--text); font-size:13px;">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; padding:10px;">Sign In</button>
    </form>

    <p style="margin-top:16px; font-size:12px; color:var(--muted); text-align:center;">
      No account?
      <a href="{{ url_for('lab.register') }}">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
