# Nginx reverse proxy — injects SystemAnalyzer tracking pixel into every lab app response

# Needed to enable sub_filter on all content types
sub_filter_types text/html application/xhtml+xml;
sub_filter_once  off;

# ── DVWA ─────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Inject tracking script before </body> on every HTML response
    sub_filter '</body>' '<script src="http://localhost:5000/static/fp.js?pixel=lab-proxy"></script></body>';

    # Route by path prefix to each container
    location /dvwa/ {
        proxy_pass         http://172.30.0.10:80/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /juice/ {
        proxy_pass         http://172.30.0.11:3000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /bwapp/ {
        proxy_pass         http://172.30.0.12:80/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /webgoat/ {
        proxy_pass         http://172.30.0.13:8080/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location / {
        return 200 '<html><body><h2>Lab Proxy Running</h2></body></html>';
        add_header Content-Type text/html;
    }
}
