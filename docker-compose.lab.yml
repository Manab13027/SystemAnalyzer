version: "3.9"

# SystemAnalyzer — Vulnerability Lab
# Run: docker compose -f docker-compose.lab.yml up -d
# Stop: docker compose -f docker-compose.lab.yml down

networks:
  lab-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:

  # ── DVWA — classic OWASP Top 10 playground ──────────────────────────────────
  lab-dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: lab-dvwa
    restart: unless-stopped
    networks:
      lab-net:
        ipv4_address: 172.30.0.10
    ports:
      - "8081:80"
    environment:
      - RECAPTCHA_PRIV_KEY=
      - RECAPTCHA_PUB_KEY=
    labels:
      lab.challenge: "dvwa"
      lab.name: "DVWA"

  # ── OWASP Juice Shop — modern JS/API vulns ───────────────────────────────────
  lab-juice:
    image: bkimminich/juice-shop:latest
    container_name: lab-juice
    restart: unless-stopped
    networks:
      lab-net:
        ipv4_address: 172.30.0.11
    ports:
      - "3001:3000"
    labels:
      lab.challenge: "juice"
      lab.name: "Juice Shop"

  # ── bWAPP — 100+ web vulnerabilities ────────────────────────────────────────
  lab-bwapp:
    image: raesene/bwapp:latest
    container_name: lab-bwapp
    restart: unless-stopped
    networks:
      lab-net:
        ipv4_address: 172.30.0.12
    ports:
      - "8082:80"
    labels:
      lab.challenge: "bwapp"
      lab.name: "bWAPP"

  # ── WebGoat — guided OWASP lessons ──────────────────────────────────────────
  lab-webgoat:
    image: webgoat/webgoat:latest
    container_name: lab-webgoat
    restart: unless-stopped
    networks:
      lab-net:
        ipv4_address: 172.30.0.13
    ports:
      - "8083:8080"
      - "9090:9090"
    environment:
      - WEBGOAT_HOST=0.0.0.0
      - WEBGOAT_PORT=8080
    labels:
      lab.challenge: "webgoat"
      lab.name: "WebGoat"

  # ── Metasploitable 2 — network service exploits ──────────────────────────────
  lab-metasploitable:
    image: tleemcjr/metasploitable2:latest
    container_name: lab-metasploitable
    restart: unless-stopped
    networks:
      lab-net:
        ipv4_address: 172.30.0.14
    ports:
      - "2222:22"    # SSH (vsftpd backdoor on 21 is internal only)
      - "8084:80"    # HTTP
      - "5432:5432"  # PostgreSQL
      - "3306:3306"  # MySQL
    labels:
      lab.challenge: "metasploitable"
      lab.name: "Metasploitable 2"

  # ── Nginx proxy — injects tracking pixel into all lab apps ──────────────────
  lab-proxy:
    image: nginx:alpine
    container_name: lab-proxy
    restart: unless-stopped
    networks:
      lab-net:
        ipv4_address: 172.30.0.2
    ports:
      - "8080:80"
    volumes:
      - ./lab/nginx/lab.conf:/etc/nginx/conf.d/default.conf:ro
      - ./lab/nginx/inject.js:/usr/share/nginx/html/inject.js:ro
    depends_on:
      - lab-dvwa
      - lab-juice
      - lab-bwapp
      - lab-webgoat
